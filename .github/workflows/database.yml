# Applique les migrations au projet Supabase hébergé, sans rien installer en local.
#
# Déclenchement manuel : onglet « Actions » → « Base de données » → « Run workflow ».
# Déclenchement automatique : dès qu'un fichier de supabase/migrations/ est poussé.
#
# Secrets à créer une fois (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   référence du projet (Project Settings → General)
#   SUPABASE_DB_PASSWORD   mot de passe de la base (Project Settings → Database)
name: Base de données

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Lancer les tests de sécurité (RLS) après la mise à jour"
        type: boolean
        default: true
      seed_employees:
        description: "Créer le compte de direction et les 10 collaboratrices (sans effet si déjà fait)"
        type: boolean
        default: false
  push:
    paths:
      - "supabase/migrations/**"

# Deux mises à jour de schéma en parallèle se marcheraient dessus.
concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    name: Appliquer les migrations
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vérifier que les secrets sont configurés
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing — voir docs/DEPLOIEMENT.md, étape 2."
            exit 1
          fi

          # Le jeton personnel et les clés du projet se confondent facilement.
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *)
              echo "::error::SUPABASE_ACCESS_TOKEN n'est pas un jeton personnel : il doit commencer par sbp_. Vous avez probablement collé la clé anon ou service_role, qui vont dans Vercel et non dans GitHub. Créez le bon jeton depuis l'avatar Supabase en haut à droite → Account Preferences → Access Tokens. Voir docs/DEPLOIEMENT.md, étape 2."
              exit 1
              ;;
          esac

          case "$SUPABASE_PROJECT_REF" in
            *.supabase.co | http*)
              echo "::error::SUPABASE_PROJECT_REF doit contenir uniquement la Reference ID du projet, pas son adresse complète. Dans https://xxxxx.supabase.co, c'est la partie xxxxx."
              exit 1
              ;;
          esac

      - name: Relier le projet Supabase
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Aperçu des migrations à appliquer
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run --yes

      - name: Appliquer les migrations
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Régénérer les types TypeScript depuis la base réelle
        # Fichier généré : il est listé dans .prettierignore et laissé tel quel.
        run: npx supabase gen types typescript --linked --schema public > src/core/db/database.types.ts

      - name: Committer les types s'ils ont changé
        run: |
          if git diff --quiet -- src/core/db/database.types.ts; then
            echo "Types inchangés : le code correspond déjà à la base."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/core/db/database.types.ts
            git commit -m "chore(db): régénère les types depuis la base [skip ci]"
            git push
          fi

      - name: Vérifier que le code compile avec les types réels
        run: npm run typecheck

      # Idempotent : une collaboratrice déjà présente est laissée telle quelle, et
      # aucun code PIN en service n'est modifié.
      - name: Créer la direction et les collaboratrices
        if: inputs.seed_employees
        run: |
          missing=""
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$ADMIN_EMAIL" ] || missing="$missing ADMIN_EMAIL"
          [ -n "$ADMIN_PASSWORD" ] || missing="$missing ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants pour la création :$missing — voir docs/DEPLOIEMENT.md, étape 6."
            exit 1
          fi
          npm run seed:employees

      # Nécessite l'extension pgTAP, installée une fois depuis l'éditeur SQL :
      #   create extension if not exists pgtap with schema extensions;
      - name: Tests de sécurité (RLS)
        if: inputs.run_tests
        run: |
          # `supabase test db` n'accepte pas --password : il lit SUPABASE_DB_PASSWORD
          # depuis l'environnement, déjà exporté au niveau du job.
          if ! npx supabase test db --linked --yes; then
            echo "::error::Les tests de sécurité ont échoué. Si le message ci-dessus mentionne « pgtap » ou « function ... does not exist », l'extension n'est pas encore installée sur le projet : voir docs/DEPLOIEMENT.md, étape 5."
            exit 1
          fi
